AutoName: Solo Forge
Summary: Local-first intermittent fasting, calorie, weight & workout tracker
Description: |-
  Solo Forge is a local-first fitness tracker for intermittent fasting,
  nutrition, weight, and workouts.

  Features:

  * Fasting timer with state-driven reminders
  * Food photo analysis using the user's own OpenRouter API key
  * Manual food logging and editable macro estimates
  * Weight tracking with history and charting
  * Workout timers with local session history
  * Daily journal notes on the progress calendar
  * Full backup and restore to a single file

  Solo Forge has no backend, no accounts, no analytics, and no crash
  reporting. Fitness data stays on the device unless the user explicitly
  exports it. Food photos are sent only when the user starts analysis.

